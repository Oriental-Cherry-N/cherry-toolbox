name: Cherry Toolbox CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/setup-routing-core.cjs
      - name: Verify without administrator privileges
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci-verify.ps1
      - run: python test/wechat_worker_passive_test.py
      - run: npm run package
